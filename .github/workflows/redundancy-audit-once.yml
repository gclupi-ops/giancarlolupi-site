name: Redundancy cleanup once

on:
  push:
    branches:
      - redundancy-audit-2026-09-04

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove redundant and floating blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def load(p): return Path(p).read_text(encoding='utf-8')
          def save(p,s): Path(p).write_text(s,encoding='utf-8')
          def sub_once(s, pattern, repl, label, flags=0):
              out,n=re.subn(pattern,repl,s,count=1,flags=flags)
              if n!=1: raise SystemExit(f'{label}: expected 1 replacement, got {n}')
              return out

          # Home: remove the duplicated trust strip, redundant editorial byline and floating principles.
          p='index.html'; s=load(p)
          s=sub_once(s,r'<div class="hero-trust">.*?</div></div>\s*<section class="section">','<section class="section">','home hero-trust',re.S)
          s=sub_once(s,r'<div class="editorial-signature">.*?</div>','','home editorial signature',re.S)
          s=sub_once(s,r'<div class="journal-principles">.*?</div>','','home journal principles',re.S)
          save(p,s)

          # Editorial archive: hero already explains authorship; keep one explicit Method section, remove duplicate manifesto/topic strip.
          p='approfondimenti.html'; s=load(p)
          s=sub_once(s,r'<div class="editorial-byline">.*?</div>','','archive byline',re.S)
          s=sub_once(s,r'<section class="section editorial-manifesto">.*?</section>\s*','','archive duplicate manifesto',re.S)
          s=s.replace('<div class="kicker">Metodo</div><h2>Come viene costruito un articolo.</h2>','<div class="kicker">Metodo editoriale</div><h2>Come viene costruito un articolo.</h2>',1)
          save(p,s)

          # Articles: sources and disclaimer already explain method; remove the repeated side-box.
          for p in ['approfondimenti/mal-di-schiena-quando-preoccuparsi.html','approfondimenti/risonanza-mal-di-schiena.html','approfondimenti/robotica-neurochirurgia.html']:
              s=load(p)
              s=sub_once(s,r'<div class="aside-box"><div class="kicker">Linea editoriale</div><p>.*?</p></div>','','article duplicate editorial box',re.S)
              save(p,s)

          # Profile: QSalute is already presented on Home; avoid repeating social proof on the personal profile.
          p='medico.html'; s=load(p)
          s=sub_once(s,r'<section class="section warm">.*?</section>','','profile duplicate QSalute section',re.S)
          save(p,s)

          # CV: footer/navigation already reconnect to the clinical profile; remove isolated return CTA.
          p='cv-pubblicazioni.html'; s=load(p)
          s=sub_once(s,r'<section class="section"><div class="container"><div class="cta-band"><div><div class="kicker">Profilo professionale</div>.*?</section>','','cv return CTA',re.S)
          save(p,s)

          # Locations: hero + each card already explain booking; remove repeated booking callout under the cards.
          p='sedi.html'; s=load(p)
          s=sub_once(s,r'<div class="callout" style="margin-top:34px">.*?</div>','','locations repeated booking callout',re.S)
          save(p,s)

          # Privacy: keep the update information but not as a visual callout.
          p='privacy.html'; s=load(p)
          old='<div class="callout"><strong>Aggiornamento.</strong> Informativa aggiornata il 3 settembre 2026. Il sito è professionale e personale e non costituisce un canale istituzionale dell\'Azienda Ospedaliero-Universitaria Pisana o delle strutture private presso cui vengono svolte visite.</div>'
          new='<p class="meta"><strong>Aggiornamento.</strong> Informativa aggiornata il 3 settembre 2026. Il sito è professionale e personale e non costituisce un canale istituzionale dell\'Azienda Ospedaliero-Universitaria Pisana o delle strutture private presso cui vengono svolte visite.</p>'
          if old not in s: raise SystemExit('privacy update block not found')
          s=s.replace(old,new,1); save(p,s)

          # Sanity checks: intentionally retained callouts are clinical/urgent/decision-oriented.
          checks={
            'index.html':['journal-principles','hero-trust','editorial-signature'],
            'approfondimenti.html':['editorial-manifesto','topic-nav','editorial-byline'],
            'medico.html':['section warm'],
          }
          for p,tokens in checks.items():
              s=load(p)
              for t in tokens:
                  if t in s: raise SystemExit(f'{p}: stale token {t}')

          Path('.github/workflows/redundancy-audit-once.yml').unlink()
          PY
      - name: Commit cleanup
        run: |
          git config user.name "gclupi-ops"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Rimuove elementi ridondanti e galleggianti"
          git push origin HEAD:redundancy-audit-2026-09-04
