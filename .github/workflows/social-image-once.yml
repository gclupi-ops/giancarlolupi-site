name: Social image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-social-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --upgrade pillow
      - name: Generate social image and update metadata
        run: python tools/generate_og_image.py
      - name: Commit generated asset and metadata
        run: |
          git config user.name "gclupi-ops"
          git config user.email "actions@users.noreply.github.com"
          git add assets/og-image.jpg '*.html' approfondimenti/*.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Aggiorna immagine social 1200x630 e Open Graph"
          git push
