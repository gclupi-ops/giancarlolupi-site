name: Remove editorial reading time once

on:
  push:
    paths:
      - '.github/remove-reading-time-ready'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove reading time and record editorial rule
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          article = Path('approfondimenti/intelligenza-artificiale-risonanza-colonna.html')
          text = article.read_text(encoding='utf-8')
          old = '<span>Diagnostica · Tecnologia</span><span>05 settembre 2026</span><span>9 minuti</span>'
          new = '<span>Diagnostica · Tecnologia</span><span>05 settembre 2026</span>'
          assert old in text
          article.write_text(text.replace(old, new, 1), encoding='utf-8')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          rule = '\n- Negli editoriali non mostrare tempi di lettura stimati (es. “9 minuti”): nella testata mantenere categoria e data.\n'
          if rule.strip() not in r:
              marker = '## Aggiornamenti editoriali\n'
              assert marker in r
              r = r.replace(marker, marker + rule, 1)
              readme.write_text(r, encoding='utf-8')
          PY

          rm -f .github/remove-reading-time-ready
          rm -f .github/workflows/remove-reading-time-once.yml
          git config user.name "gclupi-ops"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Rimuove il tempo di lettura dagli editoriali"
          git push origin HEAD:main
