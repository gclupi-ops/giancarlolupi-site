name: Typography refinement once

on:
  push:
    branches:
      - typography-refinement-2026-09-04

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine typography and location cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/styles.css')
          s = p.read_text(encoding='utf-8')
          imp = '@import url("https://fonts.googleapis.com/css2?family=Roboto+Serif:opsz,wght@8..144,400;8..144,500;8..144,600&display=swap");\n'
          if not s.startswith('@import url("https://fonts.googleapis.com/css2?family=Roboto+Serif:'):
              s = imp + s
          marker = '/* Clinical typography refinement · 2026-09-04 */'
          if marker not in s:
              s += '''\n\n/* Clinical typography refinement · 2026-09-04 */\n:root{\n  --serif:"Roboto Serif",Georgia,"Times New Roman",serif;\n  --type-label:13px;\n  --type-note:15px;\n  --type-ui:15px;\n  --type-body:17px;\n  --type-lead:20px;\n  --type-h3:24px;\n  --type-section:24px;\n  --type-page:clamp(30px,3.6vw,42px);\n  --type-home:clamp(34px,4.4vw,52px);\n}\nbody{font-size:17px;line-height:1.6}\nh1,h2{font-family:var(--serif);font-weight:500;letter-spacing:-.025em;line-height:1.1}\nh3{line-height:1.2}\n.hero h1{font-size:var(--type-home);line-height:1.1;letter-spacing:-.03em}\n.page-hero h1,.article-hero h1{font-size:var(--type-page);line-height:1.1;letter-spacing:-.025em;max-width:900px}\nh2,.section-head h2,.voice-intro h2,.cta-band h2,.copy h2,.prose h2,.journal-head h2,.editorial-mast h2,.archive-feature h2{font-size:var(--type-section);line-height:1.1;letter-spacing:-.02em;font-weight:500}\n.journal-head h2 span{font-weight:500;color:#657078}\nh3,.card h3,.voice-card h3,.location h3,.article-card h3,.dossier-item h3,.archive-row h3,.method-grid h3,.side-story h3,.journal-lead h3,.feature-story h3{font-size:var(--type-h3);line-height:1.2}\n.lead,.page-hero p,.journal-deck,.article-lede,.care-statement{font-size:var(--type-lead);line-height:1.35}\n.section-head p,.journal-intro p,.manifesto-copy{font-size:var(--type-lead);line-height:1.35}\n.prose p,.prose li,.article-prose p,.article-prose li,.copy p{font-size:var(--type-body);line-height:1.6}\n.card p,.voice-card p,.location p,.article-card p,.dossier-item p,.archive-row p,.method-grid p,.side-story p,.journal-lead p{font-size:var(--type-note);line-height:1.6}\n.brand span span,.eyebrow,.kicker,.tag,.footer-title,.breadcrumb,.story-meta,.journal-meta,.dossier-title,.archive-label,.archive-feature-meta,.archive-date,.archive-reading,.article-meta,.article-author span,.editorial-byline span,.editorial-signature span,.editorial-signature small,.journal-principles span,.booking-label,.hero-note,.hero-trust div,.voice-intro .stat-label,.voice-source,.location .details,.location .site,.meta,.editorial-foot,.journal-evidence,.contact-link,.map-link,.hero-art .label span,.editorial-mast .issue,.topic-nav span,.footer-bottom{font-size:var(--type-label);line-height:1.45}\n.location,.location:not(:first-child){padding:30px 28px 34px}\n.location h3{font-size:24px;line-height:1.2}\n.location p{font-size:15px}\n.location .phone.phone-cta{display:block;min-height:48px;width:100%;margin-top:18px;padding:12px 0;border:0;background:transparent;color:var(--ink);font-family:var(--serif);font-size:20px;line-height:1.2;text-decoration:none}\n.location .phone.phone-cta:hover{border:0;background:transparent;color:var(--blue)}\n.phone-cta span{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}\n.phone-cta strong{font-family:var(--serif);font-size:20px;font-weight:500;line-height:1.2}\n.quote{font-size:clamp(28px,2.8vw,36px);line-height:1.15}\n@media(max-width:760px){\n  :root{--type-section:22px;--type-page:30px;--type-home:34px;--type-h3:22px;--type-lead:20px;--type-body:17px}\n  .hero h1{font-size:34px}\n  .page-hero h1,.article-hero h1{font-size:30px}\n  h2,.section-head h2,.voice-intro h2,.cta-band h2,.copy h2,.prose h2,.journal-head h2,.editorial-mast h2,.archive-feature h2{font-size:22px}\n  h3,.card h3,.voice-card h3,.location h3,.article-card h3,.dossier-item h3,.archive-row h3,.method-grid h3,.side-story h3,.journal-lead h3,.feature-story h3{font-size:22px}\n  .location,.location:not(:first-child){padding:24px 0}\n  .phone-cta strong{font-size:20px}\n}\n'''
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/typography-refinement-once.yml
      - name: Verify and commit
        run: |
          grep -q "Roboto Serif" assets/styles.css
          grep -q "Clinical typography refinement · 2026-09-04" assets/styles.css
          git config user.name "gclupi-ops"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Ricalibra tipografia e schede sedi"
          git push origin HEAD:typography-refinement-2026-09-04
