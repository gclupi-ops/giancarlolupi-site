name: Verify footer live once

on:
  push:
    paths:
      - '.github/workflows/verify-footer-live-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify live footer destinations 16 of 16
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, time, urllib.request
          from urllib.parse import urljoin, urlsplit, urlunsplit

          base = 'https://www.giancarlolupi.com/'
          pages = [
              'index.html','colonna.html','neurochirurgia.html','seconda-opinione.html',
              'medico.html','approfondimenti.html','sedi.html','privacy.html',
              'cv-pubblicazioni.html','rassegna-stampa.html','documentazione-clinica.html','404.html',
              'approfondimenti/intelligenza-artificiale-risonanza-colonna.html',
              'approfondimenti/mal-di-schiena-quando-preoccuparsi.html',
              'approfondimenti/risonanza-mal-di-schiena.html',
              'approfondimenti/robotica-neurochirurgia.html',
          ]
          assert len(pages) == 16 and len(set(pages)) == 16

          def clean_url(u):
              p = urlsplit(u)
              return urlunsplit((p.scheme, p.netloc, p.path, '', ''))

          def get(url):
              req = urllib.request.Request(url, headers={'User-Agent':'footer-semantic-check/1.0'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.status, r.geturl(), r.read().decode('utf-8')

          expected_cv = base + 'cv-pubblicazioni.html'
          expected_press = base + 'rassegna-stampa.html'

          for i, rel in enumerate(pages):
              page_url = base + rel
              status, final_url, text = get(page_url + f'?footer_semantic={int(time.time())}_{i}')
              assert status == 200, f'HTTP {status}: {rel}'
              m = re.search(r'<footer>.*?</footer>', text, re.I | re.S)
              assert m, f'footer assente: {rel}'
              footer = m.group(0)

              cvm = re.search(r'<a\s+href="([^"]+)"[^>]*>\s*CV e pubblicazioni\s*</a>', footer, re.I | re.S)
              prm = re.search(r'<a\s+href="([^"]+)"[^>]*>\s*Rassegna stampa\s*</a>', footer, re.I | re.S)
              assert cvm, f'link CV assente: {rel}'
              assert prm, f'link rassegna assente: {rel}'

              cv_target = clean_url(urljoin(clean_url(final_url), cvm.group(1)))
              press_target = clean_url(urljoin(clean_url(final_url), prm.group(1)))
              assert cv_target == expected_cv, f'CV errato {rel}: {cvm.group(1)} -> {cv_target}'
              assert press_target == expected_press, f'Rassegna errata {rel}: {prm.group(1)} -> {press_target}'
              print('LIVE_FOOTER_OK', rel, cvm.group(1), prm.group(1))

          # Le due destinazioni devono essere raggiungibili direttamente.
          for target in (expected_cv, expected_press):
              status, final_url, _ = get(target + f'?target_check={int(time.time())}')
              assert status == 200, f'target non raggiungibile: {target} -> {status}'
              print('TARGET_OK', target, '->', clean_url(final_url))

          # Conferma live della rimozione dei soli due residui AI.
          _, _, home = get(base + 'index.html?reading_time_final=1')
          _, _, archive = get(base + 'approfondimenti.html?reading_time_final=1')
          assert '<span>05 settembre 2026</span><span>9 min</span>' not in home
          assert '<span>05 settembre 2026</span><span>9 minuti</span>' not in archive
          print('PRODUCTION_CERTIFICATION_OK 16/16')
          PY

      - name: Remove verifier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gclupi-ops"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/verify-footer-live-once.yml
          git add -A
          git commit -m "Rimuove verificatore temporaneo dei footer" || exit 0
          git push origin HEAD:main
