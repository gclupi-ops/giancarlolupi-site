name: Verify production once

on:
  push:
    paths:
      - .github/workflows/verify-production-once.yml

permissions:
  contents: write

jobs:
  verify-production:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Chromium checker
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Verify production in a real browser
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/check.mjs <<'JS'
          import { chromium } from 'playwright';

          const base = 'https://www.giancarlolupi.com';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          const fontResponses = [];
          page.on('response', r => {
            if (r.url().includes('/assets/fonts/roboto-serif.woff2')) {
              fontResponses.push({url:r.url(), status:r.status(), type:r.headers()['content-type'] || ''});
            }
          });

          await page.goto(base + '/?verify=20260905-font', {waitUntil:'networkidle'});
          const fontCheck = await page.evaluate(async () => {
            await document.fonts.ready;
            const h1 = document.querySelector('h1');
            const mono = document.querySelector('.monogram');
            return {
              serif500: document.fonts.check('500 42px "Roboto Serif"'),
              serif700: document.fonts.check('700 15px "Roboto Serif"'),
              h1Family: h1 ? getComputedStyle(h1).fontFamily : null,
              h1Weight: h1 ? getComputedStyle(h1).fontWeight : null,
              monogramFamily: mono ? getComputedStyle(mono).fontFamily : null,
              monogramWeight: mono ? getComputedStyle(mono).fontWeight : null,
            };
          });
          console.log('FONT_CHECK', JSON.stringify(fontCheck));
          console.log('FONT_RESPONSES', JSON.stringify(fontResponses));
          if (!fontCheck.serif500 || !fontCheck.serif700) throw new Error('Roboto Serif non risulta caricato in document.fonts');
          if (!fontCheck.h1Family?.includes('Roboto Serif')) throw new Error('H1 non usa Roboto Serif');
          if (!fontCheck.monogramFamily?.includes('Roboto Serif') || fontCheck.monogramWeight !== '700') throw new Error('Monogramma non usa Roboto Serif 700');
          if (!fontResponses.some(r => r.status === 200)) throw new Error('Nessuna risposta 200 per il WOFF2');

          const checks = [
            ['/rassegna-stampa', '/rassegna-stampa.html'],
            ['/cvitae', '/cv-pubblicazioni.html'],
            ['/approfondimenti/intelligenza-artificiale-risonanza-colonna.html', '/approfondimenti/intelligenza-artificiale-risonanza-colonna.html'],
          ];
          for (const [path, expected] of checks) {
            const p = await browser.newPage();
            const response = await p.goto(base + path + '?verify=20260905-pages', {waitUntil:'domcontentloaded'});
            const finalUrl = new URL(p.url());
            const status = response?.status();
            console.log('PAGE_CHECK', path, status, finalUrl.pathname);
            if (!response?.ok()) throw new Error(`${path}: HTTP ${status}`);
            if (finalUrl.pathname !== expected) throw new Error(`${path}: destinazione ${finalUrl.pathname}, attesa ${expected}`);
            await p.close();
          }
          await browser.close();
          JS
          node /tmp/check.mjs

      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/verify-production-once.yml
          git config user.name 'gclupi-ops'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rimuove verifica live completata'
          git push
