name: CSS refactor finalize 2 once
on:
  push:
    branches: [css-refactor-2026-09-05]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: css-refactor-2026-09-05
      - name: Finalize CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('assets/styles.css'); css=p.read_text(encoding='utf-8'); before=len(css.encode())
          html='\n'.join(x.read_text(encoding='utf-8') for x in Path('.').rglob('*.html'))
          unused=('hero-trust','editorial-grid','editorial-mast','editorial','feature-story','side-stories','side-story','editorial-foot','article-grid','article-card','journal-principles','editorial-signature','topic-nav')
          for cls in unused: assert f'class="{cls}' not in html, cls
          pats=[r'\.editorial-grid\{[^{}]*\}',r'\.feature-story\{[^{}]*\}',r'\.side-stories\{[^{}]*\}',r'\.side-story:first-child\{[^{}]*\}',r'\.side-story\{[^{}]*\}',r'\.editorial\{[^{}]*\}',r'\.editorial-mast\{[^{}]*\}',r'\.editorial-mast \.issue\{[^{}]*\}',r'\.editorial-foot\{[^{}]*\}',r'\.article-grid\{[^{}]*\}',r'\.hero-trust\{[^{}]*\}',r'\.hero-trust div[^{}]*\{[^{}]*\}',r'\.journal-principles\{[^{}]*\}',r'\.journal-principles span[^{}]*\{[^{}]*\}',r'\.editorial-signature\{[^{}]*\}',r'\.editorial-signature span,\.editorial-signature small\{[^{}]*\}',r'\.editorial-signature strong\{[^{}]*\}',r'\.topic-nav\{[^{}]*\}',r'\.topic-nav span\{[^{}]*\}']
          for pat in pats: css=re.sub(pat,'',css)
          assert '--type-home:clamp(34px,4.4vw,52px);' in css
          css=css.replace('--type-home:clamp(34px,4.4vw,52px);','--type-home:clamp(34px,4.4vw,52px);\n  --type-stat:50px;',1)
          css=css.replace('.voice-intro .stat{font-family:var(--serif);font-size:50px;','.voice-intro .stat{font-family:var(--serif);font-size:var(--type-stat);')
          cmap={'font-size:clamp(23px,2.15vw,31px)':'font-size:var(--type-lead)','font-size:clamp(38px,4.3vw,60px)':'font-size:var(--type-page)','font-size:clamp(36px,4vw,52px)':'font-size:var(--type-section)','font-size:clamp(52px,6vw,82px)':'font-size:var(--type-page)','font-size:clamp(54px,15vw,76px)':'font-size:var(--type-home)','font-size:clamp(48px,5.8vw,78px)':'font-size:var(--type-section)','font-size:clamp(38px,4vw,56px)':'font-size:var(--type-h3)','font-size:clamp(42px,4.8vw,62px)':'font-size:var(--type-section)','font-size:clamp(48px,6vw,76px)':'font-size:var(--type-page)'}
          for a,b in cmap.items(): css=css.replace(a,b)
          css=css.replace('font-size:9px','font-size:var(--type-label)').replace('font-size:10px','font-size:var(--type-label)').replace('font-size:42px','font-size:var(--type-section)').replace('font-size:56px','font-size:var(--type-page)')
          css=css.replace('font-size:var(--type-note);line-height:var(--lh-body);-webkit-font-smoothing','font-size:var(--type-body);line-height:var(--lh-body);-webkit-font-smoothing',1)
          old='''@media(max-width:760px){\n  .hero h1{font-size:34px}\n  .page-hero h1,.article-hero h1{font-size:30px}\n  h2,.section-head h2,.voice-intro h2,.cta-band h2,.copy h2,.prose h2,.journal-head h2,.archive-feature h2{font-size:22px}\n  h3,.card h3,.voice-card h3,.location h3,.dossier-item h3,.archive-row h3,.method-grid h3,.journal-lead h3{font-size:22px}\n  .location,.location:not(:first-child){padding:24px 0}\n}'''
          new='''@media(max-width:760px){\n  html{--type-section:22px;--type-h3:22px;--type-page:30px;--type-home:34px}\n  .location,.location:not(:first-child){padding:24px 0}\n}'''
          assert old in css
          css=css.replace(old,new)
          css=re.sub(r'\n{3,}','\n\n',css)
          sizes=sorted(set(re.findall(r'font-size:([^;}]+)',css))); lhs=sorted(set(re.findall(r'line-height:([^;}]+)',css)))
          print('CSS bytes',before,'->',len(css.encode())); print('font-size',len(sizes),sizes); print('line-height',len(lhs),lhs)
          assert css.count(':root{')==1 and css.count('.location .phone.phone-cta{')==1 and css.count('.phone-cta strong{')==1
          assert '!important' not in css and len(lhs)<=6 and len(sizes)<=12
          assert not re.search(r'font-size:[^;}]*(?:104|82|78|76)px',css)
          p.write_text(css,encoding='utf-8')
          PY
      - name: Commit
        run: |
          rm .github/workflows/css-refactor-finalize2-once.yml
          git config user.name "gclupi-ops"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Rimuove le regole tipografiche residue"
          git push origin HEAD:css-refactor-2026-09-05
