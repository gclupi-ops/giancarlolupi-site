name: Site maintenance

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/site_maintenance.py'
      - 'tools/identity_schema.py'

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply site maintenance
        run: |
          python tools/site_maintenance.py
          python tools/identity_schema.py
      - name: Commit generated changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "gclupi-ops"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "Applica manutenzione tecnica del sito"
          git push
