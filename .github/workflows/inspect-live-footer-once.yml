name: Inspect live footer once

on:
  push:
    paths:
      - '.github/workflows/inspect-live-footer-once.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Print live footer and headers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, time, urllib.request
          url='https://www.giancarlolupi.com/index.html?footer_inspect='+str(int(time.time()))
          req=urllib.request.Request(url,headers={'User-Agent':'footer-inspect/1.0'})
          with urllib.request.urlopen(req,timeout=20) as r:
              print('STATUS',r.status)
              print('FINAL_URL',r.geturl())
              print('SERVER',r.headers.get('server'))
              print('X_NF_REQUEST_ID',r.headers.get('x-nf-request-id'))
              text=r.read().decode('utf-8')
          print('HAS_CV_LABEL', 'CV e pubblicazioni' in text)
          print('HAS_PRESS_LABEL', 'Rassegna stampa' in text)
          print('HAS_NEW_AI_META', '<span>05 settembre 2026</span><span>9 min</span>' not in text)
          m=re.search(r'<footer>.*?</footer>',text,re.I|re.S)
          print('FOOTER_BEGIN')
          print(m.group(0) if m else 'NO_FOOTER')
          print('FOOTER_END')
          PY
      - name: Remove inspector
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gclupi-ops"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/inspect-live-footer-once.yml
          git add -A
          git commit -m "Rimuove ispettore temporaneo footer" || exit 0
          git push origin HEAD:main
