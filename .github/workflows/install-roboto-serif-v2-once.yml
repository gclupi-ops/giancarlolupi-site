name: Install Roboto Serif v2 once

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/font-chunks/READY'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify transfer before touching site
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/chunk-sha256 <<'EOF'
          9c4a3efacdf11df5789e68646de25bf412add6dcad2da35f740b515ba3c6d9a0  .github/font-chunks/part-00
          9d226dbaf96e7f4914cf86b4783b8621092020d052555191eac5e75acb8e1a9d  .github/font-chunks/part-01
          e646aa06b7dad35d50cd1094cc49ce78d2110dae6fbf4935d29a71b4f2591e42  .github/font-chunks/part-02
          35c75360e0df220e20a0f9349e3f0884731182f60262cef46d447202220b19e2  .github/font-chunks/part-03
          0c256745facbb8c70b3e410035448c0f402ddf40482dc7a7d50f368042f6b500  .github/font-chunks/part-04
          5d5112b03844e1e3021327b6302a363522b2615038c7b430ecf7eba437474e0e  .github/font-chunks/part-05
          2bdcbde6a7df4fec2416f4ccf0330c14c114aaab4385ac6ccf7446222954a911  .github/font-chunks/part-06
          EOF
          sha256sum -c /tmp/chunk-sha256
          mapfile -t parts < <(find .github/font-chunks -maxdepth 1 -type f -name 'part-*' -printf '%p\n' | sort -V)
          test "${#parts[@]}" -eq 7
          cat "${parts[@]}" > /tmp/font.b64
          test "$(wc -c < /tmp/font.b64)" -eq 86856
          base64 -d /tmp/font.b64 > /tmp/roboto-serif-v2.woff2
          echo "5a184301787a54723d651cf8c13134bd6e811d8adfd2e4428416186bd59d2bef  /tmp/roboto-serif-v2.woff2" | sha256sum -c -
          test "$(wc -c < /tmp/roboto-serif-v2.woff2)" -eq 65140
          test "$(head -c 4 /tmp/roboto-serif-v2.woff2)" = "wOF2"

      - name: Install font and update references
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/roboto-serif-v2.woff2 assets/fonts/roboto-serif-v2.woff2
          rm -f assets/fonts/roboto-serif.woff2
          python3 - <<'PY'
          from pathlib import Path
          import re
          old='/assets/fonts/roboto-serif.woff2'
          new='/assets/fonts/roboto-serif-v2.woff2'
          css=Path('assets/styles.css')
          s=css.read_text(encoding='utf-8')
          assert s.count(old)==1
          css.write_text(s.replace(old,new),encoding='utf-8')
          pages=sorted(Path('.').glob('*.html'))+sorted(Path('approfondimenti').glob('*.html'))
          assert len(pages)==16
          for p in pages:
              t=p.read_text(encoding='utf-8')
              assert t.count(old)==1,(p,t.count(old))
              t=t.replace(old,new)
              t,n=re.subn(r'(styles\.css\?v=)[0-9-]+',r'\g<1>20260905-3',t,count=1)
              assert n==1,(p,n)
              p.write_text(t,encoding='utf-8')
          PY

      - name: Verify source tree and glyph coverage
        shell: bash
        run: |
          set -euo pipefail
          echo "5a184301787a54723d651cf8c13134bd6e811d8adfd2e4428416186bd59d2bef  assets/fonts/roboto-serif-v2.woff2" | sha256sum -c -
          test "$(wc -c < assets/fonts/roboto-serif-v2.woff2)" -eq 65140
          test ! -e assets/fonts/roboto-serif.woff2
          python3 -m pip install --quiet fonttools
          python3 - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont
          old='/assets/fonts/roboto-serif.woff2'; new='/assets/fonts/roboto-serif-v2.woff2'
          css=Path('assets/styles.css').read_text(encoding='utf-8')
          assert css.count(new)==1 and old not in css
          pages=sorted(Path('.').glob('*.html'))+sorted(Path('approfondimenti').glob('*.html'))
          assert len(pages)==16
          for p in pages:
              t=p.read_text(encoding='utf-8')
              assert t.count(new)==1 and old not in t and t.count('styles.css?v=20260905-3')==1,p
          f=TTFont('assets/fonts/roboto-serif-v2.woff2')
          cmap=set().union(*(set(t.cmap) for t in f['cmap'].tables))
          needed={0x2013,0x2014,0x2018,0x2019,0x201C,0x201D}
          assert not (needed-cmap),sorted(needed-cmap)
          print('source checks OK')
          PY

      - name: Commit clean final tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/font-chunks
          rm -f .github/workflows/install-roboto-serif-v2-once.yml
          rm -f .github/workflows/install-roboto-serif-v2-retry.yml
          git config user.name "gclupi-ops"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Sostituisce Roboto Serif con il file ottimizzato"
          git push origin HEAD:main

      - name: Verify production asset
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            html=$(curl -fsSL "https://www.giancarlolupi.com/seconda-opinione.html?deploy_check=$i" || true)
            if grep -q 'roboto-serif-v2.woff2' <<<"$html" && grep -q 'styles.css?v=20260905-3' <<<"$html"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" -eq 1
          curl -fsSL "https://www.giancarlolupi.com/assets/fonts/roboto-serif-v2.woff2?deploy_check=$(date +%s)" -o /tmp/live.woff2
          echo "5a184301787a54723d651cf8c13134bd6e811d8adfd2e4428416186bd59d2bef  /tmp/live.woff2" | sha256sum -c -
          test "$(wc -c < /tmp/live.woff2)" -eq 65140

      - name: Verify actual rendered fonts in Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > /tmp/verify.cjs <<'JS'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          const cases=[
            {url:'https://www.giancarlolupi.com/seconda-opinione.html',selector:'h2',needle:'si può operare'},
            {url:'https://www.giancarlolupi.com/approfondimenti/risonanza-mal-di-schiena.html',selector:'h2',needle:'Una RM'},
            {url:'https://www.giancarlolupi.com/cv-pubblicazioni.html',selector:'h3',needle:'Helsinki'}
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const c of cases){
              const page=await browser.newPage();
              await page.goto(c.url+'?font_check='+Date.now(),{waitUntil:'networkidle'});
              await page.evaluate(()=>document.fonts.ready);
              const client=await page.context().newCDPSession(page);
              await client.send('DOM.enable'); await client.send('CSS.enable');
              const {root}=await client.send('DOM.getDocument',{depth:-1});
              const {nodeIds}=await client.send('DOM.querySelectorAll',{nodeId:root.nodeId,selector:c.selector});
              let found=false;
              for(const nodeId of nodeIds){
                const {outerHTML}=await client.send('DOM.getOuterHTML',{nodeId});
                if(!outerHTML.includes(c.needle)) continue;
                const {fonts}=await client.send('CSS.getPlatformFontsForNode',{nodeId});
                const used=fonts.filter(f=>f.glyphCount>0);
                console.log('PLATFORM_FONTS',c.needle,JSON.stringify(used.map(f=>({family:f.familyName,glyphs:f.glyphCount,custom:f.isCustomFont}))));
                if(used.length!==1||used[0].familyName!=='Roboto Serif'||!used[0].isCustomFont) throw new Error('Fallback rilevato: '+JSON.stringify(used)+' — '+c.needle);
                found=true; break;
              }
              if(!found) throw new Error('Target not found: '+c.needle);
              await page.close();
            }
            await browser.close();
          })();
          JS
          node /tmp/verify.cjs
