name: Cache bust typography once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cache-bust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version stylesheet references
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              s2 = s.replace('assets/styles.css"', 'assets/styles.css?v=20260904-2"')
              s2 = s2.replace('../assets/styles.css"', '../assets/styles.css?v=20260904-2"')
              if s2 != s:
                  p.write_text(s2, encoding='utf-8')
          PY
          rm -f .github/workflows/cache-bust-typography-once.yml
      - name: Verify and commit
        run: |
          grep -R "styles.css?v=20260904-2" --include='*.html' . >/dev/null
          git config user.name "gclupi-ops"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Forza il caricamento della nuova tipografia"
          git push origin HEAD:main
