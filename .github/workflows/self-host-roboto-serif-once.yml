name: Self-host Roboto Serif once

on:
  push:
    paths:
      - .github/workflows/self-host-roboto-serif-once.yml

permissions:
  contents: write

jobs:
  build-font:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build local Roboto Serif
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'fonttools[woff]>=4.55' brotli
          mkdir -p assets/fonts /tmp/roboto-serif
          curl -fL 'https://raw.githubusercontent.com/google/fonts/main/ofl/robotoserif/RobotoSerif%5BGRAD%2Copsz%2Cwdth%2Cwght%5D.ttf' -o /tmp/roboto-serif/RobotoSerif.ttf
          curl -fL 'https://raw.githubusercontent.com/google/fonts/main/ofl/robotoserif/OFL.txt' -o assets/fonts/OFL.txt
          fonttools varLib.instancer /tmp/roboto-serif/RobotoSerif.ttf GRAD=0 wdth=100 opsz=32 wght=400:700 --output=/tmp/roboto-serif/RobotoSerif-instanced.ttf
          pyftsubset /tmp/roboto-serif/RobotoSerif-instanced.ttf \
            --output-file=assets/fonts/roboto-serif.woff2 \
            --flavor=woff2 \
            --unicodes='U+0000-024F,U+1E00-1EFF,U+20AC' \
            --layout-features='*' \
            --name-IDs='*' \
            --name-legacy \
            --name-languages='*' \
            --glyph-names \
            --symbol-cmap \
            --legacy-cmap \
            --notdef-glyph \
            --recommended-glyphs

      - name: Patch CSS and preload font
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          css = root / 'assets' / 'styles.css'
          text = css.read_text(encoding='utf-8')
          text = re.sub(r'^@import url\("https://fonts\.googleapis\.com/[^\n]+\n?', '', text, count=1)
          face = '''@font-face{\n  font-family:"Roboto Serif";\n  src:url("/assets/fonts/roboto-serif.woff2") format("woff2");\n  font-style:normal;\n  font-weight:400 700;\n  font-display:swap;\n}\n\n'''
          if '@font-face{' not in text[:500]:
              text = face + text
          css.write_text(text, encoding='utf-8')

          preload = '<link rel="preload" href="/assets/fonts/roboto-serif.woff2" as="font" type="font/woff2" crossorigin>'
          for html in root.rglob('*.html'):
              s = html.read_text(encoding='utf-8')
              if preload not in s:
                  marker = re.search(r'<link rel="stylesheet"[^>]*>', s)
                  if not marker:
                      raise RuntimeError(f'No stylesheet link in {html}')
                  s = s[:marker.start()] + preload + s[marker.start():]
              s = re.sub(r'assets/styles\.css\?v=20260905-1', 'assets/styles.css?v=20260905-2', s)
              s = re.sub(r'\.\./assets/styles\.css\?v=20260905-1', '../assets/styles.css?v=20260905-2', s)
              html.write_text(s, encoding='utf-8')

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/fonts/roboto-serif.woff2
          test -s assets/fonts/OFL.txt
          ! grep -R --include='*.css' -n 'fonts.googleapis.com\|fonts.gstatic.com' .
          grep -q 'font-weight:400 700' assets/styles.css
          COUNT_HTML=$(find . -name '*.html' | wc -l)
          COUNT_PRELOAD=$(grep -R -l --include='*.html' '/assets/fonts/roboto-serif.woff2' . | wc -l)
          test "$COUNT_HTML" -eq "$COUNT_PRELOAD"
          python - <<'PY'
          from fontTools.ttLib import TTFont
          f=TTFont('assets/fonts/roboto-serif.woff2')
          axes={a.axisTag:(a.minValue,a.defaultValue,a.maxValue) for a in f['fvar'].axes}
          assert set(axes)=={'wght'}, axes
          assert axes['wght'][0] == 400 and axes['wght'][2] == 700, axes
          print('font-bytes', __import__('os').path.getsize('assets/fonts/roboto-serif.woff2'))
          print('axes', axes)
          PY

      - name: Commit site changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/self-host-roboto-serif-once.yml
          git config user.name 'gclupi-ops'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Self-host Roboto Serif e rimuove Google Fonts'
          git push
