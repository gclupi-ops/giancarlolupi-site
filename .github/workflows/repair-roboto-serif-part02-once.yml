name: Repair Roboto Serif part-02 once

on:
  push:
    paths:
      - '.github/font-fix/READY'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and verify part-02
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fix-sha256 <<'EOF'
          1809e892c8b439494c3ab57fb2ac715d2e2c4c059ef66f360d22e8f82436a48a  .github/font-fix/part-02-0
          099b9db84475c88d75f5ec0bae3e709b489c1aa138d5a6b74ef79cf349562e84  .github/font-fix/part-02-1
          4227613246ad29aa57a9f6e9aa5498df61fe3da498658737b18986ee05754837  .github/font-fix/part-02-2
          720338904db625141e3ad4197a27a9e19dc40a93bd32015f2309a34fa622755b  .github/font-fix/part-02-3
          3106e32d93b1923678a0b1550fbee01a900eeb5679b5cda5ff6395c38bb56201  .github/font-fix/part-02-4
          b4fcb671a3cbe5ed11632b2489f310071ebcb07f1a47a2d4bd9259575ec38d2b  .github/font-fix/part-02-5
          EOF
          sha256sum -c /tmp/fix-sha256
          cat .github/font-fix/part-02-{0,1,2,3,4,5} > /tmp/part-02
          test "$(wc -c < /tmp/part-02)" -eq 18000
          echo "e646aa06b7dad35d50cd1094cc49ce78d2110dae6fbf4935d29a71b4f2591e42  /tmp/part-02" | sha256sum -c -
          test "$(git hash-object /tmp/part-02)" = "9d246b19cfde341c4b4f0726f956819e80a97800"
          cp /tmp/part-02 .github/font-chunks/part-02
          rm -rf .github/font-fix
          rm -f .github/workflows/repair-roboto-serif-part02-once.yml
          git config user.name "gclupi-ops"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Ripara frammento 02 del font Roboto Serif"
          git push origin HEAD:main
