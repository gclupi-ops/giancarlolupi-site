name: Certify footer Pretty URLs once

on:
  push:
    paths:
      - '.github/workflows/certify-footer-pretty-urls-once.yml'

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Certify live footers 16 of 16
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, time, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlsplit

          base='https://www.giancarlolupi.com/'
          pages=[
            'index.html','colonna.html','neurochirurgia.html','seconda-opinione.html',
            'medico.html','approfondimenti.html','sedi.html','privacy.html',
            'cv-pubblicazioni.html','rassegna-stampa.html','documentazione-clinica.html','404.html',
            'approfondimenti/intelligenza-artificiale-risonanza-colonna.html',
            'approfondimenti/mal-di-schiena-quando-preoccuparsi.html',
            'approfondimenti/risonanza-mal-di-schiena.html',
            'approfondimenti/robotica-neurochirurgia.html'
          ]
          assert len(pages)==16 and len(set(pages))==16

          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'footer-final-cert/1.0'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return r.status,r.geturl(),r.read().decode('utf-8')

          def canonical_path(url):
              path=urlsplit(url).path.rstrip('/') or '/'
              if path.endswith('.html'):
                  path=path[:-5]
              if path=='/index':
                  path='/'
              return path

          class FooterLinks(HTMLParser):
              def __init__(self):
                  super().__init__(); self.depth=0; self.href=None; self.text=[]; self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=='footer': self.depth+=1
                  elif self.depth and tag.lower()=='a':
                      self.href=dict(attrs).get('href'); self.text=[]
              def handle_endtag(self,tag):
                  if self.depth and tag.lower()=='a' and self.href is not None:
                      self.links.append((' '.join(''.join(self.text).split()),self.href)); self.href=None; self.text=[]
                  elif tag.lower()=='footer' and self.depth: self.depth-=1
              def handle_data(self,data):
                  if self.depth and self.href is not None: self.text.append(data)

          expected={'CV e pubblicazioni':'/cv-pubblicazioni','Rassegna stampa':'/rassegna-stampa'}
          for i,rel in enumerate(pages):
              status,final_url,text=get(base+rel+f'?footer_final={int(time.time())}_{i}')
              assert status==200,(rel,status)
              parser=FooterLinks(); parser.feed(text)
              found={label:href for label,href in parser.links if label in expected}
              for label,want in expected.items():
                  assert label in found,f'{label} assente: {rel}; links={parser.links}'
                  resolved=urljoin(final_url,found[label])
                  got=canonical_path(resolved)
                  assert got==want,f'{label} errato: {rel}: {found[label]} -> {got}'
              print('LIVE_FOOTER_OK',rel,found['CV e pubblicazioni'],found['Rassegna stampa'])

          for path in ('cv-pubblicazioni','rassegna-stampa'):
              status,final_url,_=get(base+path+f'?target_final={int(time.time())}')
              assert status==200,(path,status)
              assert canonical_path(final_url)=='/'+path,(path,final_url)
              print('TARGET_OK',path,final_url)

          _,_,home=get(base+'index.html?reading_final=2')
          _,_,archive=get(base+'approfondimenti.html?reading_final=2')
          assert '<span>05 settembre 2026</span><span>9 min</span>' not in home
          assert '<span>05 settembre 2026</span><span>9 minuti</span>' not in archive
          print('PRODUCTION_CERTIFICATION_OK 16/16')
          PY
      - name: Remove verifier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gclupi-ops"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/certify-footer-pretty-urls-once.yml
          git add -A
          git commit -m "Rimuove certificatore temporaneo dei footer" || exit 0
          git push origin HEAD:main
