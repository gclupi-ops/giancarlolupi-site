name: Verify Roboto Serif render once

on:
  push:
    paths:
      - '.github/workflows/verify-font-render-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify live font and rendered glyphs
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.giancarlolupi.com/assets/fonts/roboto-serif-v2.woff2?final_verify=$(date +%s)"
          curl -fsSL -D /tmp/font.headers "$url" -o /tmp/live.woff2
          grep -iE '^content-type:[[:space:]]*font/woff2([[:space:]]|;|$)' /tmp/font.headers
          echo "5a184301787a54723d651cf8c13134bd6e811d8adfd2e4428416186bd59d2bef  /tmp/live.woff2" | sha256sum -c -
          test "$(wc -c < /tmp/live.woff2)" -eq 65140

          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > /tmp/verify.cjs <<'JS'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          const cases = [
            {url:'https://www.giancarlolupi.com/seconda-opinione.html',selector:'h2',needle:'si può operare'},
            {url:'https://www.giancarlolupi.com/approfondimenti/risonanza-mal-di-schiena.html',selector:'h2',needle:'Una RM'},
            {url:'https://www.giancarlolupi.com/cv-pubblicazioni.html',selector:'h3',needle:'Helsinki'}
          ];
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const c of cases){
              const page=await browser.newPage();
              await page.goto(c.url+'?font_final='+Date.now(),{waitUntil:'networkidle'});
              await page.evaluate(()=>document.fonts.ready);
              const checks=await page.evaluate(()=>({w500:document.fonts.check('500 16px "Roboto Serif"'),w700:document.fonts.check('700 16px "Roboto Serif"')}));
              if(!checks.w500 || !checks.w700) throw new Error('document.fonts.check failed: '+JSON.stringify(checks));
              const client=await page.context().newCDPSession(page);
              await client.send('DOM.enable'); await client.send('CSS.enable');
              const {root}=await client.send('DOM.getDocument',{depth:-1});
              const {nodeIds}=await client.send('DOM.querySelectorAll',{nodeId:root.nodeId,selector:c.selector});
              let found=false;
              for(const nodeId of nodeIds){
                const {outerHTML}=await client.send('DOM.getOuterHTML',{nodeId});
                if(!outerHTML.includes(c.needle)) continue;
                const {fonts}=await client.send('CSS.getPlatformFontsForNode',{nodeId});
                const used=fonts.filter(f=>f.glyphCount>0);
                console.log('PLATFORM_FONTS',c.needle,JSON.stringify(used.map(f=>({family:f.familyName,postScriptName:f.postScriptName,glyphs:f.glyphCount,custom:f.isCustomFont}))));
                if(used.length!==1 || !used[0].isCustomFont) throw new Error('Fallback rilevato: '+JSON.stringify(used)+' — '+c.needle);
                found=true; break;
              }
              if(!found) throw new Error('Target not found: '+c.needle);
              await page.close();
            }
            await browser.close();
          })();
          JS
          node /tmp/verify.cjs

      - name: Remove verifier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gclupi-ops"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/verify-font-render-once.yml
          git add -A
          git commit -m "Rimuove verificatore temporaneo del font" || exit 0
          git push origin HEAD:main
