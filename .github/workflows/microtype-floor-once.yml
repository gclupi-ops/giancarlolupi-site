name: Microtype floor once

on:
  push:
    branches:
      - design-unification-2026-09-04

permissions:
  contents: write

jobs:
  microtype:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce 13px minimum on remaining metadata
        run: |
          if ! grep -q "Microtype floor · 2026-09-04" assets/styles.css; then
            cat >> assets/styles.css <<'EOF'

/* Microtype floor · 2026-09-04 */
.hero-art .label span,.editorial-mast .issue,.topic-nav span,.footer-bottom{font-size:var(--type-label);line-height:1.45}
EOF
          fi
          rm -f .github/workflows/microtype-floor-once.yml
      - name: Verify and commit
        run: |
          grep -q "Microtype floor · 2026-09-04" assets/styles.css
          git config user.name "gclupi-ops"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Completa la soglia minima della microtipografia"
          git push origin HEAD:design-unification-2026-09-04
